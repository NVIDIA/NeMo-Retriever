<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">Issue 2323 local OCR batching evidence on NVIDIA H100 GPUs</title>
  <desc id="desc">Cross-page batching improves local OCR model and actor throughput. BO767 local Hugging Face whole-ingest throughput improves by 8.41 percent, while full ViDoRe v3 is flat because embedding remains the longer stage. Deployment context includes ViDoRe local, NIM, and service measurements plus the BO767 four-GPU service result.</desc>
  <rect width="1200" height="1100" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 650; }
    .section { font-size: 21px; font-weight: 650; }
    .panel { font-size: 17px; font-weight: 650; }
    .label { font-size: 14px; }
    .value { font-size: 19px; font-weight: 700; }
    .metric { font-size: 31px; font-weight: 700; }
    .note { font-size: 14px; fill: #4b5563; }
    .small { font-size: 12px; fill: #4b5563; }
    .divider { stroke: #d1d5db; stroke-width: 1; }
    .card { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
    .upstream { fill: #6b7280; }
    .patch { fill: #76b900; }
    .nim { fill: #2563eb; }
    .service { fill: #7c3aed; }
    .baseline { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; }
  </style>

  <text x="40" y="38" class="title">Issue #2323 · bounded cross-page local OCR batching</text>
  <text x="40" y="67" class="note">All GPU measurements use NVIDIA H100 80GB HBM3 · ingest timers exclude query evaluation</text>
  <line x1="40" y1="88" x2="1160" y2="88" class="divider"/>

  <text x="40" y="125" class="section">Local batching proof · 1× H100</text>
  <text x="40" y="151" class="note">128 fixed real crops · persistent Nemotron OCR v2 wrapper · crop lists capped at 8</text>

  <rect x="40" y="174" width="350" height="138" rx="8" class="card"/>
  <text x="64" y="206" class="panel">Model invocations</text>
  <text x="64" y="258" class="metric">128 → 16</text>
  <text x="64" y="286" class="note">scalar calls → list-of-8 calls</text>

  <rect x="425" y="174" width="350" height="138" rx="8" class="card"/>
  <text x="449" y="206" class="panel">OCR actor throughput</text>
  <text x="449" y="258" class="metric">34.4 → 55.8</text>
  <text x="449" y="286" class="note">crops/s · 1.62×</text>

  <rect x="810" y="174" width="350" height="138" rx="8" class="card"/>
  <text x="834" y="206" class="panel">Local model throughput</text>
  <text x="834" y="258" class="metric">40.7 → 73.4</text>
  <text x="834" y="286" class="note">crops/s · 1.81×</text>

  <line x1="40" y1="343" x2="1160" y2="343" class="divider"/>
  <text x="40" y="382" class="section">Controlled whole-ingest A/B · local Hugging Face · 1× H100</text>
  <text x="40" y="408" class="note">Same lock, profile, hardware, and default worker policy · extraction through LanceDB indexing included</text>

  <rect x="40" y="432" width="540" height="242" rx="8" class="card"/>
  <text x="64" y="466" class="panel">BO767 · 54,730 pages</text>
  <text x="64" y="491" class="note">OCR/embedding frontier moved ≈128 s earlier</text>
  <text x="64" y="535" class="label">Upstream</text>
  <rect x="160" y="512" width="289" height="30" rx="4" class="upstream"/>
  <text x="461" y="534" class="value">34.04</text>
  <text x="64" y="581" class="label">Patch</text>
  <rect x="160" y="558" width="314" height="30" rx="4" class="patch"/>
  <text x="486" y="580" class="value">36.90</text>
  <text x="64" y="626" class="value">+8.41% pages/s</text>
  <text x="272" y="626" class="note">ingest time −7.75%</text>
  <text x="64" y="652" class="small">Counterbalanced A/B · 1,608.019 s → 1,483.343 s</text>

  <rect x="620" y="432" width="540" height="242" rx="8" class="card"/>
  <text x="644" y="466" class="panel">Full ViDoRe v3 · 19,252 pages</text>
  <text x="644" y="491" class="note">Embedding continues 60–381 s after OCR</text>
  <text x="644" y="535" class="label">Upstream</text>
  <rect x="740" y="512" width="325" height="30" rx="4" class="upstream"/>
  <text x="1077" y="534" class="value">9.280</text>
  <text x="644" y="581" class="label">Patch</text>
  <rect x="740" y="558" width="324" height="30" rx="4" class="patch"/>
  <text x="1076" y="580" class="value">9.268</text>
  <text x="644" y="626" class="value">Flat · −0.12%</text>
  <text x="798" y="626" class="note">8/8 datasets passed</text>
  <text x="644" y="652" class="small">Retrieval quality preserved · page-image embedding remains the longer stage</text>

  <line x1="40" y1="706" x2="1160" y2="706" class="divider"/>
  <text x="40" y="745" class="section">Deployment context · unchanged remote and service paths</text>
  <text x="40" y="771" class="note">These validate current deployment modes; they are not attributed to the local-only batching patch.</text>

  <rect x="40" y="795" width="700" height="248" rx="8" class="card"/>
  <text x="64" y="829" class="panel">Full ViDoRe v3 throughput</text>
  <text x="64" y="854" class="small">pages/s · GPU count shown per deployment</text>
  <text x="64" y="890" class="label">Local HF patch · 1×</text>
  <rect x="230" y="870" width="185" height="25" rx="4" class="patch"/>
  <text x="427" y="889" class="value">9.268</text>
  <text x="64" y="929" class="label">Self-hosted NIM · 1×</text>
  <rect x="230" y="909" width="193" height="25" rx="4" class="nim"/>
  <text x="435" y="928" class="value">9.652</text>
  <text x="64" y="968" class="label">Service nightly · 4×</text>
  <rect x="230" y="948" width="300" height="25" rx="4" class="baseline"/>
  <text x="542" y="967" class="value">≈14.994</text>
  <text x="64" y="1007" class="label">Service PR run · 4×</text>
  <rect x="230" y="987" width="336" height="25" rx="4" class="service"/>
  <text x="578" y="1006" class="value">16.820</text>

  <rect x="770" y="795" width="390" height="248" rx="8" class="card"/>
  <text x="794" y="829" class="panel">BO767 service · 4× H100</text>
  <text x="794" y="854" class="small">pages/s · supplied service baseline</text>
  <text x="794" y="895" class="label">Baseline</text>
  <rect x="884" y="874" width="203" height="28" rx="4" class="baseline"/>
  <text x="1099" y="895" class="value">84.64</text>
  <text x="794" y="943" class="label">Measured</text>
  <rect x="884" y="922" width="211" height="28" rx="4" class="service"/>
  <text x="1107" y="943" class="value">87.772</text>
  <text x="794" y="991" class="value">+3.70% pages/s</text>
  <text x="794" y="1017" class="small">623.545 s · 767/767 files · context, not patch effect</text>

  <text x="600" y="1077" text-anchor="middle" class="small">Local-HF bars are the controlled patch A/B · NIM/service measurements establish deployment compatibility</text>
</svg>
