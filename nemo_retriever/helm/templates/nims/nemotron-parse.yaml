{{- if and (and (.Capabilities.APIVersions.Has "apps.nvidia.com/v1alpha1") .Values.nims.enabled) (eq .Values.nimOperator.nemotron_parse.enabled true) -}}
{{- $nimSecrets := dict "context" $ "key" "nemotron_parse" "cfg" .Values.nimOperator.nemotron_parse -}}
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: nemotron-parse
  {{- include "nemo-retriever.nimcache.keepPolicy" . | nindent 2 }}
spec:
  source:
    ngc:
      modelPuller: "{{ .Values.nimOperator.nemotron_parse.image.repository }}:{{ .Values.nimOperator.nemotron_parse.image.tag }}"
      pullSecret: {{ include "nemo-retriever.nimPullSecret" $nimSecrets | quote }}
      authSecret: {{ include "nemo-retriever.nimAuthSecret" $nimSecrets | quote }}
      {{- include "nemo-retriever.nimcache.modelBlock" (dict "context" $ "key" "nemotron_parse") | nindent 6 }}
  storage:
    pvc:
      create: {{ .Values.nimOperator.nemotron_parse.storage.pvc.create }}
      storageClass: {{ .Values.nimOperator.nemotron_parse.storage.pvc.storageClass | quote }}
      size: {{ .Values.nimOperator.nemotron_parse.storage.pvc.size }}
      volumeAccessMode: {{ .Values.nimOperator.nemotron_parse.storage.pvc.volumeAccessMode }}
  nodeSelector:
{{ toYaml .Values.nimOperator.nemotron_parse.nodeSelector | indent 4 }}
  tolerations:
{{ toYaml .Values.nimOperator.nemotron_parse.tolerations | indent 4 }}
---
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: nemotron-parse
spec:
  image:
    repository: {{ .Values.nimOperator.nemotron_parse.image.repository }}
    tag: {{ .Values.nimOperator.nemotron_parse.image.tag }}
    pullPolicy: {{ .Values.nimOperator.nemotron_parse.image.pullPolicy }}
    pullSecrets:
{{ include "nemo-retriever.nimPullSecrets" $nimSecrets | indent 6 }}
  authSecret: {{ include "nemo-retriever.nimAuthSecret" $nimSecrets | quote }}
  storage:
    nimCache:
      name: nemotron-parse
  replicas: {{ .Values.nimOperator.nemotron_parse.replicas }}
  nodeSelector:
{{ toYaml .Values.nimOperator.nemotron_parse.nodeSelector | indent 4 }}
  {{- include "nemo-retriever.nimServiceResources" (dict "context" $ "resources" .Values.nimOperator.nemotron_parse.resources) | nindent 2 }}
  tolerations:
{{ toYaml .Values.nimOperator.nemotron_parse.tolerations | indent 4 }}
  expose:
{{ toYaml .Values.nimOperator.nemotron_parse.expose | indent 4 }}
  env:
{{ include "nemo-retriever.nimServiceOtelEnv" (dict "context" $ "key" "nemotron_parse" "name" "nemotron-parse") | nindent 4 }}
{{ toYaml .Values.nimOperator.nemotron_parse.env | indent 4 }}
{{- end }}
