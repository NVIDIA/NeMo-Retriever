# Managed Helm target for the BO767 VL text-image hybrid qualification run.
# Set HARNESS_HELM_SERVICE_IMAGE_REPOSITORY and HARNESS_HELM_SERVICE_IMAGE_TAG
# to the immutable service image under test.
helm_chart: ../../helm
helm_release: nemo-retriever-bo767-vl-text-image
helm_namespace: nemo-retriever-bo767-vl-text-image
helm_values_file: ../helm-profiles/core.yaml
helm_timeout: 1800
readiness_timeout: 1800
helm_service_local_port: 17670
helm_bin: microk8s helm
kubectl_bin: microk8s kubectl
helm_sudo: true
kubectl_sudo: true
helm_set:
  serviceConfig.vectordb.embedModel: nvidia/llama-nemotron-embed-vl-1b-v2
  serviceConfig.vectordb.indexMode: hybrid
  serviceConfig.vectordb.tableName: bo767_vl_text_image_hybrid
  nimOperator.vlm_embed.env:
    - name: NIM_HTTP_API_PORT
      value: "8000"
    - name: NIM_TRITON_LOG_VERBOSE
      value: "1"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: NIM_ENGINE_PRECISION
      value: fp16
