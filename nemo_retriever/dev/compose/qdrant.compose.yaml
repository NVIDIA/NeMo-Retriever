# Runs VectorDB against a bundled Qdrant server:
#   docker compose -f service-mode.compose.yaml -f qdrant.compose.yaml up

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-v1.19.1}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  vectordb:
    environment:
      NRL_VDB_OP: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant: {condition: service_healthy}

volumes:
  qdrant_data:
