markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
      restrict_base_path: false
      base_path: "."
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - def_list
  - admonition
  - footnotes

# MkDocs 1.6+: exclude suite landing and legacy duplicate pages (still in repo for parity).
# extraction/chunking.md — removed from nav; content is under concepts.md (redirect_maps keeps old URLs).
# Use /index.md (docs root only); bare index.md would exclude every index.md (e.g. under subfolders).
exclude_docs: |
  /index.md
  extraction/chunking.md
  extraction/helm.md
  extraction/choose-your-path.md
  extraction/hosted-nims-when-to-use.md
  extraction/workflow-e2e-blueprints.md
  extraction/releasenotes-nv-ingest.md
  extraction/workflow-build-searchable-collection.md
  extraction/vector-db-partners.md

extra:
  generator: false
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NVIDIA/NeMo-Retriever/

