# NeMo Retriever documentation — single MkDocs config for NVIDIA docs and GitHub Pages.
# Flat numbered sections (sections 1–9) drive the NRL TOC everywhere.
#
# Local setup (once, from repository root):
#   pip install -r docs/requirements.txt
#   pip install -e ./nemo_retriever
#
# Local build (strict; from docs/):
#   cd docs && mkdocs build -f mkdocs.yml --strict
#   (mkdocs.nrl-github-pages.yml was removed; use mkdocs.yml only)
# Output: docs/site/ (static HTML; open site/index.html or serve the folder).
#
# GitHub Pages: .github/workflows/nrl-docs-github-pages.yml runs the same command after
# actions/configure-pages sets SITE_URL, then uploads docs/site as the Pages artifact.
# Locally, omit SITE_URL to use the default site_url below.

site_name: NeMo Retriever Documentation
site_description: NeMo Retriever documentation — library, deployment, and operations guides
site_url: !ENV [SITE_URL, "https://docs.nvidia.com/nemo/retriever/"]

repo_name: NVIDIA/NeMo-Retriever
repo_url: https://github.com/NVIDIA/NeMo-Retriever

theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.annotate
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.instant.prefetch
    - navigation.top
    - navigation.footer
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    code: Roboto Mono
  favicon: assets/images/favicon.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: light
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: dark
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: nvidia/nvidia-logo
    repo: fontawesome/brands/github

extra_css:
  - assets/css/color-schemes.css
  - assets/css/fonts.css
  - assets/css/custom-material.css
  - assets/css/jupyter-themes.css
#  - assets/css/chatbot.css

# extra_javascript:
#   - assets/js/chatbot.js

# Flat numbered sections (sections 1–9) drive the NRL TOC everywhere.
nav:
  - "1. Understand NeMo Retriever Library":
      - "NeMo Retriever Library Overview": extraction/understand/overview.md
      - Key concepts: extraction/understand/concepts.md
      - "Agentic retrieval (concept)": extraction/understand/agentic-retrieval-concept.md
  - "2. Get started":
      - About this section: extraction/get-started/getting-started-about.md
      - "Pre-Requisites & Support Matrix": extraction/get-started/prerequisites-support-matrix.md
      - "Quickstart: NeMo Retriever Library": https://github.com/NVIDIA/NeMo-Retriever/tree/26.08.1/nemo_retriever
      - "Authentication and API keys": extraction/get-started/api-keys.md
  - "3. Ingest and extract content":
      - "Workflow: Ingest documents into a searchable VDB collection": extraction/ingest/workflow-document-ingestion.md
      - "Workflow: Audio & video ingestion": extraction/ingest/audio-video.md
      - Multimodal extraction: extraction/ingest/multimodal-extraction.md
      - "Multimodal embeddings (VLM)": extraction/ingest/embedding.md
  - "4. Search and manage collections":
      - "Vector databases": extraction/collections/vdbs.md
      - "Workflow: Agentic retrieval": extraction/collections/workflow-agentic-retrieval.md
      - "Collection management API": reference/collection-management-api.md
  - "5. Deploy and operate":
      - "Compare deployment options": extraction/deploy/deployment-options.md
      - "OpenShift deployment (Helm)": https://github.com/NVIDIA/NeMo-Retriever/blob/26.08.1/nemo_retriever/helm/openshift.md
      - "Helm chart (Kubernetes)": https://github.com/NVIDIA/NeMo-Retriever/tree/26.08.1/nemo_retriever/helm
      - "Docker service image": https://github.com/NVIDIA/NeMo-Retriever/blob/26.08.1/nemo_retriever/docker.md
      - "Ray and distributed ingest": extraction/deploy/ray-logging.md
      - "Batch resource sizing": extraction/deploy/performance_guide.md
  - "6. Customize and contribute":
      - "Customize & extend": extraction/customize/customize-extend.md
      - Contributing: extraction/customize/contributing.md
  - "7. Evaluate and troubleshoot":
      - "Evaluate on your own documents": extraction/support/evaluate-on-your-data.md
      - Troubleshooting: extraction/support/troubleshoot.md
      - FAQ: extraction/support/faq.md
  - "8. Reference and changes":
      - "API guide": extraction/reference/nemo-retriever-api-reference.md
      # TODO: after nv-ingest code removal, update this link when CLI docs are relocated.
      - "CLI reference": https://github.com/NVIDIA/NeMo-Retriever/tree/26.08.1/nemo_retriever/docs/cli
      - "Quickstart: retriever CLI": reference/retriever-cli-quickstart.md
      - Environment variables: extraction/reference/environment-config.md
      - "Metadata reference": extraction/reference/content-metadata.md
      - Release notes: extraction/reference/releasenotes.md
  - "9. Integrations & ecosystem":
      - "Starter kits": https://github.com/NVIDIA/NeMo-Retriever/blob/26.08.1/examples/README.md
  - Additional resources:
      - "OSS licences": license.md

plugins:
  - search
  # uncomment below to grab api
  # - gen-files:
  #     scripts:
  #       - scripts/gen_ref_pages.py
  - macros
  - mike:
      alias_type: copy
      canonical_version: "latest"
      version_selector: true
      css_dir: assets/css
      javascript_dir: assets/js
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: true
            show_submodules: false
            inherited_members: false
            members_order: source
            filters:
              - "!^_"
          paths:
            - ../nemo_retriever/src
  - mkdocs-jupyter:
      theme: auto
      highlight_extra_classes: "jupyter-notebook"
  - redirects:
      redirect_maps:
        index.md: extraction/understand/overview.md
        extraction/index.md: extraction/understand/overview.md
        # TODO: after nv-ingest code removal, update this link when CLI docs are relocated.
        extraction/nv-ingest_cli.md: https://github.com/NVIDIA/NeMo-Retriever/tree/26.08.1/nemo_retriever/docs/cli
        extraction/helm.md: extraction/deploy/deployment-options.md
        extraction/quickstart-guide.md: https://github.com/NVIDIA/NeMo-Retriever/tree/26.08.1/nemo_retriever/helm
        extraction/choose-your-path.md: extraction/deploy/deployment-options.md
        extraction/hosted-nims-when-to-use.md: extraction/deploy/deployment-options.md
        extraction/releasenotes-nv-ingest.md: extraction/reference/releasenotes.md
        extraction/ngc-api-key.md: extraction/get-started/api-keys.md
        extraction/notebooks/index.md: https://github.com/NVIDIA/NeMo-Retriever/blob/26.08.1/examples/README.md
        extraction/notebooks.md: https://github.com/NVIDIA/NeMo-Retriever/blob/26.08.1/examples/README.md
