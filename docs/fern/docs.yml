instances:
  - url: nv-ingest.docs.buildwithfern.com/nemo/retriever/latest/extraction/overview
    custom-domain: docs.nvidia.com/nemo/retriever/latest/extraction/overview
    multi-source: true


title: NeMo Retriever

global-theme: nvidia

logo:
  href: /nemo/retriever/latest/extraction/overview/nightly
  right-text: NeMo Retriever

navbar-links:
  - type: github
    value: https://github.com/NVIDIA/NeMo-Retriever

experimental:
  mdx-components:
    - ./components

versions:
  - display-name: nightly
    path: versions/nightly.yml
    slug: nightly

redirects:
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/index.html"
    destination: "/nemo/retriever/latest/extraction/overview/nightly"
  - source: "/index"
    destination: "/nemo/retriever/latest/extraction/overview/nightly"
  - source: "/nightly/:path*/index.html"
    destination: "/nemo/retriever/latest/extraction/overview/nightly/:path*"
  - source: "/:path*/index.html"
    destination: "/nemo/retriever/latest/extraction/overview/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/nemo/retriever/latest/extraction/overview/:path*"
  - source: "/nightly/:path*"
    destination: "/nemo/retriever/latest/extraction/overview/nightly/:path*"
