name: Nightly Builds & Publishing

on:
  schedule:
    # Runs every day at 11:30PM UTC
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      skip-docker:
        description: 'Skip Docker build/publish'
        required: false
        type: boolean
        default: false
      skip-pypi:
        description: 'Skip PyPI build/publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Generate version for all nightly builds
  determine-version:
    name: Determine Nightly Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      docker-tag: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        uses: ./.github/actions/determine-version
        with:
          date-format: '%Y.%m.%d'

  # Build and publish Docker nightly
  docker-build-publish:
    name: Docker Nightly Build & Publish
    if: ${{ !inputs.skip-docker }}
    needs: determine-version
    runs-on: linux-large-disk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Schedule always publishes from default-branch main. workflow_dispatch
          # uses the selected ref so a PR branch can be built and pushed to NGC.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      - name: Setup Docker Buildx
        uses: ./.github/actions/setup-docker-buildx
        with:
          use-qemu: 'true'
          platforms: 'linux/amd64,linux/arm64'

      - name: Login to NGC
        uses: ./.github/actions/docker-login-ngc
        with:
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create HF token file
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
        run: |
          mkdir -p ./scripts/private_local
          if [ -n "${HF_ACCESS_TOKEN}" ]; then
            printf '%s' "${HF_ACCESS_TOKEN}" > ./scripts/private_local/hf_token.txt
          fi

      - name: Build and Push Multi-platform Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: service
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            DOWNLOAD_DEFAULT_TOKENIZER=True
            GIT_COMMIT=${{ github.sha }}
            RETRIEVER_VERSION=${{ needs.determine-version.outputs.version }}
            RETRIEVER_RELEASE_TYPE=dev
          tags: ${{ secrets.DOCKER_REGISTRY }}/nrl-service:${{ needs.determine-version.outputs.docker-tag }}
          secret-files: hf_token=./scripts/private_local/hf_token.txt

      - name: Cleanup HF token file
        if: always()
        run: rm -f ./scripts/private_local/hf_token.txt

  # Build and publish PyPI wheels
  pypi-build:
    name: PyPI Nightly Build
    if: ${{ !inputs.skip-pypi }}
    needs: determine-version
    uses: ./.github/workflows/reusable-pypi-build.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
      release-type: 'dev'
      source-ref: 'main'
      runner: 'linux-large-disk'

  pypi-publish:
    name: PyPI Nightly Publish
    if: ${{ !inputs.skip-pypi }}
    needs: pypi-build
    uses: ./.github/workflows/reusable-pypi-publish.yml
    secrets:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

  # Summary
  nightly-complete:
    name: Nightly Build Complete
    needs:
      - determine-version
      - docker-build-publish
      - pypi-publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Nightly build completed for version: ${{ needs.determine-version.outputs.version }}"
          echo "Docker: ${{ needs.docker-build-publish.result }}"
          echo "PyPI: ${{ needs.pypi-publish.result }}"
