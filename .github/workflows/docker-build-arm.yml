name: Build NV-Ingest Runtime Image (arm64)

on:
  # Manual-only. Main-branch CI also builds linux/arm64 (QEMU smoke tests)
  # and pushes a multi-arch nrl-service image to NGC. Nightly does the same
  # on a schedule.
  workflow_dispatch:
    inputs:
      test-selection:
        description: 'Test selection strategy (random keeps QEMU runtime bounded)'
        required: false
        type: choice
        default: 'random'
        options:
          - random
          - full

permissions:
  contents: read

jobs:
  # Delegates to the shared reusable workflow so the arm64 build and test
  # commands cannot drift from the amd64 legs.
  #
  # This job has no NGC login, so it builds from the open source ubuntu base
  # image rather than the nvcr.io base image used by nightly and release.
  build-and-test:
    name: Build & Test Docker (arm64)
    uses: ./.github/workflows/reusable-docker-build-and-test.yml
    with:
      platform: 'linux/arm64'
      target: 'service'
      tags: 'nrl-service:arm64-${{ github.sha }}'
      base-image: 'ubuntu'
      base-image-tag: 'jammy-20250415.1'
      use-qemu: true
      test-selection: ${{ inputs.test-selection }}
      random-count: '100'
      pytest-markers: 'not integration'
      coverage: false
      runner: 'linux-large-disk'
    secrets:
      HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
